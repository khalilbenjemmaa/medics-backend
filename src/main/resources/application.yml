spring:
  application:
    name: practice-api

  # Only used when app.notifications.email.enabled is true.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/practice}
    username: ${DATABASE_USERNAME:practice}
    password: ${DATABASE_PASSWORD:practice}
    hikari:
      pool-name: practice-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. `validate` turns a drifted entity into a
    # startup failure instead of a silent runtime surprise.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # NOTE: hibernate.jdbc.time_zone is deliberately NOT set.
        #
        # It would be redundant — every timestamp here is an Instant in
        # a TIMESTAMPTZ column, which is already absolute — and it is
        # actively harmful, because it also shifts TIME columns. The
        # weekly schedule stores local wall-clock times, so with that
        # setting a 09:00 interval read back as 11:00 in summer and the
        # whole working day silently moved.
        #
        # Surfaces N+1 access as a failure in tests rather than as a
        # slow endpoint in production.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # Nulls are serialised explicitly rather than stripped.
    #
    # A typed client needs to tell "this appointment has no meeting
    # link" from "this API version has no such field". Omitting the key
    # collapses those into the same thing, and the documented contract
    # (and the frontend's types) say meetingUrl is `string | null`.
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never leak internals to a client; GlobalExceptionHandler owns the
    # shape of every error response.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  # Everything is persisted as an Instant. This zone is the practice's
  # local wall-clock, used to interpret weekly availability rules and to
  # render times back to the client. Never hardcoded elsewhere.
  doctor-timezone: ${APP_DOCTOR_TIMEZONE:Europe/Paris}

  booking:
    slot-duration-minutes: ${APP_SLOT_DURATION_MINUTES:30}
    # Same-day booking is not offered.
    minimum-lead-time-hours: ${APP_MIN_LEAD_TIME_HOURS:24}
    maximum-horizon-days: ${APP_MAX_HORIZON_DAYS:90}

  security:
    jwt:
      # Must be supplied in every environment; there is deliberately no
      # default, so a missing secret fails startup rather than shipping
      # a known signing key.
      secret: ${JWT_SECRET}
      access-token-minutes: ${JWT_ACCESS_MINUTES:30}
      issuer: practice-api
    admin:
      # Bootstrap credentials for the single operator account, applied
      # on first start only. Change the password after first login.
      email: ${ADMIN_EMAIL:admin@reemamiri.example}
      password: ${ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  notifications:
    email:
      # Off by default. A half-configured mail client that silently
      # drops messages is worse than none, because the practice would
      # believe patients had been told.
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:noreply@reemamiri.example}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.reemamiri.practice: ${LOG_LEVEL:INFO}
